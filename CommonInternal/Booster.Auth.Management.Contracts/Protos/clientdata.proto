syntax = "proto3";
option csharp_namespace = "Booster.Auth.Management.Grpc";
package management;

// IdP'nin, bir OAuth isteğini karşılarken ihtiyaç duyduğu istemci ve havuz
// politikalarını tek çağrıda döndürür. IdP bu veriyi kendi veritabanında
// tutmaz; sahibi Management servisidir.
service ClientDataService {
  rpc GetByClientKey (GetClientDataRequest) returns (GetClientDataResponse);

  // Tek bir saglayicinin TAM yapilandirmasi, istemci sirri cozulmus halde.
  // Ayri cagri olmasinin sebebi: bu yanit onbellege ALINMAZ. ClientData ile
  // birlikte tasinsaydi sirlar Redis'te 30 dakika duz metin beklerdi.
  rpc GetFederationProvider (GetFederationProviderRequest) returns (GetFederationProviderResponse);

  // Havuzda tanimli roller ve kapsamlar. IdP, kullaniciya rol/kapsam atarken
  // yalnizca bunlarin secilebildigini dogrular.
  rpc GetPoolDefinitions (GetPoolDefinitionsRequest) returns (GetPoolDefinitionsResponse);

  // Bir istemci olmadan HAVUZUN politikalari (parola, giris, kayit) ve varsayilan rol/kapsamlari.
  // Panelden kullanici ekleme ve davet kabulu icin: bu akislarda OAuth istemcisi yoktur.
  // Yanit ClientDataMessage bicimindedir; istemciye ozel alanlar bos gelir.
  rpc GetPoolData (GetPoolDefinitionsRequest) returns (GetClientDataResponse);
}

message GetClientDataRequest {
  string client_key = 1;
}

// found=false, "istemci yok" demektir. Bulunamayan istemci hata değildir:
// IdP bunu kendi akışında invalid_client olarak karşılar.
message GetClientDataResponse {
  bool found = 1;
  ClientDataMessage client = 2;
}

message ClientDataMessage {
  string client_id = 1;                  // Guid
  string client_key = 2;
  int32 allowed_grant_types = 3;         // OAuthGrantType (flags)
  repeated string allowed_scopes = 4;
  string isolation_id = 5;               // Havuz (pool) id
  bool is_active = 6;
  repeated string redirect_uris = 7;
  repeated string post_logout_redirect_uris = 8;
  repeated string allowed_audiences = 9;
  bool require_consent = 10;
  LoginPolicyMessage login = 11;
  RegistrationPolicyMessage registration = 12;
  PasswordPolicyMessage password = 13;
  SessionPolicyMessage session = 14;
  repeated string default_scopes = 15;
  repeated DefaultRoleMessage default_roles = 16;

  // Havuzun ACIK dis kimlik saglayicilari. Yalnizca giris ekraninin ihtiyaci
  // olan kadari: ayarlar BURADA TASINMAZ cunku bazi ayarlar sir niteliginde
  // (Apple ozel anahtari gibi) ve ClientData IdP tarafinda onbellege alinir.
  repeated FederationProviderMessage federation_providers = 17;

  MfaPolicyMessage mfa = 18;
}

message MfaPolicyMessage {
  bool required = 1;
  int32 allowed_methods = 2;   // MfaMethod (flags)
}

message LoginPolicyMessage {
  int32 allowed_login_providers = 1;   // LoginProviderType (flags)
  repeated int32 allowed_identifiers = 2;   // IdentifierType
  int32 max_failed_attempts = 4;
  int32 lockout_seconds = 5;
  string default_country_code = 6;   // bos = ulke kodsuz numara reddedilir
}

message RegistrationPolicyMessage {
  int32 mode = 1;                           // RegistrationMode
  bool require_email_verification = 2;
  bool require_phone_verification = 3;
  bool allow_federated_jit = 4;
  bool allow_self_deletion = 5;             // Hesabim sayfasindan hesap silme
}

message PasswordPolicyMessage {
  int32 min_length = 1;
  bool require_uppercase = 2;
  bool require_lowercase = 3;
  bool require_digit = 4;
  bool require_non_alphanumeric = 5;
  int32 history_count = 6;   // kac eski parola tekrar kullanilamaz
  int32 expiry_days = 7;     // 0 = suresiz
}

message SessionPolicyMessage {
  int32 access_token_ttl_seconds = 1;
  int32 refresh_token_ttl_seconds = 2;
  int32 idle_timeout_seconds = 3;
}

message DefaultRoleMessage {
  string role_id = 1;                       // Guid
  string role_name = 2;
}

// Giris ekraninin gordugu kadari. Ayar YOK.
message FederationProviderMessage {
  string id = 1;                 // Guid — PrincipalIdentity.IdentityProviderId
  string key = 2;                // havuz icinde tekil, URL'de gorunur
  string provider_type = 3;      // google | github | oidc | saml ...
  string display_name = 4;
}

message GetFederationProviderRequest {
  string user_pool_id = 1;       // Guid
  string key = 2;
}

message GetFederationProviderResponse {
  bool found = 1;
  FederationProviderConfigMessage provider = 2;
}

// Saglayicinin calismasi icin gereken her sey. settings icinde client_secret
// COZULMUS olarak bulunur; bu mesaj hicbir yerde onbellege alinmamalidir.
message FederationProviderConfigMessage {
  string id = 1;
  string key = 2;
  string provider_type = 3;
  string display_name = 4;
  bool is_active = 5;
  map<string, string> settings = 6;
}

message GetPoolDefinitionsRequest {
  string user_pool_id = 1;       // Guid
}

message GetPoolDefinitionsResponse {
  bool found = 1;
  repeated PoolRoleMessage roles = 2;
  repeated string scopes = 3;
}

message PoolRoleMessage {
  string id = 1;                 // Guid
  string key = 2;
}
