syntax = "proto3";
option csharp_namespace = "Booster.Auth.Idp.Grpc";
package idp;

// Management'ta bir rol/kapsam silindiginde veya adi degistiginde IdP'deki
// karsiliklarini (kimlik atamalari, aktif refresh token'lar, onaylar) esitler.
// Management kendi kaydini bu cagri basarili olduktan SONRA yazar; cagrilar
// tekrar edilebilir (idempotent) oldugu icin yarida kalan islem yeniden denenebilir.
service PrincipalAccessService {
  rpc RenameRole (RenameRoleRequest) returns (PrincipalAccessSyncResponse);
  rpc RemoveRole (RemoveRoleRequest) returns (PrincipalAccessSyncResponse);
  rpc RenameScope (RenameScopeRequest) returns (PrincipalAccessSyncResponse);
  rpc RemoveScope (RemoveScopeRequest) returns (PrincipalAccessSyncResponse);
}

message RenameRoleRequest {
  string isolation_id = 1;   // Guid — rolun havuzu
  string role_id = 2;        // Guid
  string old_key = 3;
  string new_key = 4;
}

message RemoveRoleRequest {
  string isolation_id = 1;
  string role_id = 2;
  string key = 3;
}

message RenameScopeRequest {
  string isolation_id = 1;
  string old_scope = 2;
  string new_scope = 3;
}

message RemoveScopeRequest {
  string isolation_id = 1;
  string scope = 2;
}

// Etkilenen kimlik sayisi; bilgi amaclidir.
message PrincipalAccessSyncResponse {
  int32 affected_principals = 1;
}
