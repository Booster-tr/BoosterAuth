# booster-labs-site image'i (www.boosterslabs.com kurumsal tanitim sitesi). Yalnizca asagidaki yollara
# dokunan PR'larda calisir (Actions dakikasi yalnizca etkilenen servis icin harcanir).
#   PR acildi / guncellendi -> build kontrolu
#   PR merge edildi         -> yayin (GHCR + GitOps -> canli)
name: labs-site

on:
  # Yalnizca master hedefli PR'lar; master'a dogrudan push hicbir sey tetiklemez.
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, closed]
    paths:
      - "Services/Booster.Labs.Site/**"
      - "docker/**"
      - ".github/workflows/_build-image.yml"
      - ".github/workflows/labs-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # GHCR push

jobs:
  image:
    # Merge edilmeden kapatilan PR: hic calismaz (dakika harcanmaz).
    if: github.event.action != 'closed' || github.event.pull_request.merged
    uses: ./.github/workflows/_build-image.yml
    secrets: inherit            # GITOPS_DEPLOY_KEY (CD adimi icin)
    with:
      image: booster-labs-site
      project: Services/Booster.Labs.Site/Booster.Labs.Site.csproj
      app: Booster.Labs.Site
