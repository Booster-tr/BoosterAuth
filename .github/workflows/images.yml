# Booster.Auth servis image'larini build edip GHCR'a gonderir.
#
#   master'a push   -> 7 image build + push:  ghcr.io/<owner>/<image>:sha-<kisa-sha> ve :latest
#   pull request    -> yalnizca build (push yok) - kod derleniyor mu kontrolu
#   elle            -> Actions sekmesinden "Run workflow"
#
# Build mantigi docker/Dockerfile'da; bu dosya yalnizca "hangi proje, hangi image adi"
# listesini tutar. Baska bir CI'a tasirken ayni docker build komutlari kullanilir.
name: images

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Ayni branch'e arka arkaya push edilirse eski calisma iptal edilir.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # GHCR'a push icin (GITHUB_TOKEN yeterli, ayrica secret gerekmez)

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: booster-auth-gateway
            project: Gateways/Booster.Auth.YarpGateway/Booster.Auth.YarpGateway.csproj
            app: Booster.Auth.YarpGateway
          - image: booster-auth-idp
            project: Idps/Booster.Auth.Idp/Booster.Auth.Idp.csproj
            app: Booster.Auth.Idp
          - image: booster-auth-management-api
            project: Services/Booster.Auth.Management.Api/Booster.Auth.Management.Api.csproj
            app: Booster.Auth.Management.Api
          - image: booster-auth-authz
            project: Services/Booster.Auth.Z/Booster.Auth.Z.csproj
            app: Booster.Auth.Z
          - image: booster-logging-service
            project: Services/Booster.LoggingService/Booster.LoggingService.csproj
            app: Booster.LoggingService
          - image: booster-notification-service
            project: Services/Booster.NotificationService/Booster.NotificationService.csproj
            app: Booster.NotificationService
          - image: booster-systemmessage-service
            project: Services/Booster.SystemMessageService/Booster.SystemMessageService.csproj
            app: Booster.SystemMessageService

    steps:
      - uses: actions/checkout@v4

      # GHCR image adlari kucuk harf olmak zorunda (Booster-tr -> booster-tr)
      - name: Image adi
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR girisi
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Etiketler: sha-<kisa-sha> (GitOps bunu kullanir, degismez) + latest (yalnizca master)
      - name: Etiketler
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build ve push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            PROJECT=${{ matrix.project }}
            APP_NAME=${{ matrix.app }}
            VERSION=sha-${{ github.sha }}
            REVISION=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Katman onbellegi image basina ayri tutulur; sonraki build'ler hizlanir.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
