# booster-logging-service image'i. Yalnizca asagidaki yollarda degisiklik olursa calisir
# (Actions dakikasi yalnizca etkilenen servis icin harcanir).
name: logging

on:
  push:
    branches: [master]
    paths:
      - "Services/Booster.LoggingService/**"
      - "Common/**"
      - "CommonInternal/**"
      - "docker/**"
      - ".github/workflows/_build-image.yml"
      - ".github/workflows/logging.yml"
  pull_request:
    paths:
      - "Services/Booster.LoggingService/**"
      - "Common/**"
      - "CommonInternal/**"
      - "docker/**"
      - ".github/workflows/_build-image.yml"
      - ".github/workflows/logging.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # GHCR push

jobs:
  image:
    uses: ./.github/workflows/_build-image.yml
    secrets: inherit            # GITOPS_DEPLOY_KEY (CD adimi icin)
    with:
      image: booster-logging-service
      project: Services/Booster.LoggingService/Booster.LoggingService.csproj
      app: Booster.LoggingService
