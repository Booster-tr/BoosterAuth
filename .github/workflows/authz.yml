# booster-auth-authz image'i. Yalnizca asagidaki yollarda degisiklik olursa calisir
# (Actions dakikasi yalnizca etkilenen servis icin harcanir).
name: authz

on:
  push:
    branches: [master]
    paths:
      - "Services/Booster.Auth.Z/**"
      - "Common/**"
      - "CommonInternal/**"
      - "docker/**"
      - ".github/workflows/_build-image.yml"
      - ".github/workflows/authz.yml"
  pull_request:
    paths:
      - "Services/Booster.Auth.Z/**"
      - "Common/**"
      - "CommonInternal/**"
      - "docker/**"
      - ".github/workflows/_build-image.yml"
      - ".github/workflows/authz.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # GHCR push

jobs:
  image:
    uses: ./.github/workflows/_build-image.yml
    with:
      image: booster-auth-authz
      project: Services/Booster.Auth.Z/Booster.Auth.Z.csproj
      app: Booster.Auth.Z
