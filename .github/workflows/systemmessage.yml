# booster-systemmessage-service image'i. Yalnizca asagidaki yollarda degisiklik olursa calisir
# (Actions dakikasi yalnizca etkilenen servis icin harcanir).
name: systemmessage

on:
  push:
    branches: [master]
    paths:
      - "Services/Booster.SystemMessageService/**"
      - "Common/**"
      - "CommonInternal/**"
      - "docker/**"
      - ".github/workflows/_build-image.yml"
      - ".github/workflows/systemmessage.yml"
  pull_request:
    paths:
      - "Services/Booster.SystemMessageService/**"
      - "Common/**"
      - "CommonInternal/**"
      - "docker/**"
      - ".github/workflows/_build-image.yml"
      - ".github/workflows/systemmessage.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # GHCR push

jobs:
  image:
    uses: ./.github/workflows/_build-image.yml
    with:
      image: booster-systemmessage-service
      project: Services/Booster.SystemMessageService/Booster.SystemMessageService.csproj
      app: Booster.SystemMessageService
