# Ortak build adimlari (reusable workflow). Tek basina tetiklenmez; servis
# workflow'lari (gateway.yml, idp.yml, ...) bunu "uses:" ile cagirir.
#
#   push (master)  -> build + GHCR push:  ghcr.io/<owner>/<image>:sha-<kisa-sha> ve :latest
#   pull request   -> yalnizca build (push yok)
name: _build-image

on:
  workflow_call:
    inputs:
      image:   { type: string, required: true }   # ör. booster-auth-idp
      project: { type: string, required: true }   # ör. Idps/Booster.Auth.Idp/Booster.Auth.Idp.csproj
      app:     { type: string, required: true }   # ör. Booster.Auth.Idp  (dll adi)

jobs:
  build:
    runs-on: ubuntu-latest
    # Ayni servis icin arka arkaya push gelirse eskisi iptal edilir (bosa dakika harcanmaz).
    concurrency:
      group: ${{ inputs.image }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # GHCR image adlari kucuk harf olmak zorunda (Booster-tr -> booster-tr)
      - name: Image adi
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.image }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR girisi
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha-<kisa-sha>: degismez, GitOps bunu kullanir. latest: yalnizca master.
      - name: Etiketler
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build ve push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            PROJECT=${{ inputs.project }}
            APP_NAME=${{ inputs.app }}
            VERSION=sha-${{ github.sha }}
            REVISION=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Katman onbellegi image basina ayri; degismeyen katmanlar yeniden build edilmez.
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,scope=${{ inputs.image }},mode=max
