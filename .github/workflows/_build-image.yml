# Ortak build + deploy adimlari (reusable workflow). Tek basina tetiklenmez; servis
# workflow'lari (gateway.yml, idp.yml, ...) bunu "uses:" ile cagirir.
#
# YAYIN YALNIZCA MERGE EDILEN PR ILE OLUR (master'a dogrudan push hicbir sey tetiklemez):
#   PR acildi / guncellendi  -> yalnizca build (kontrol; push yok, deploy yok)
#   PR merge edildi          -> build + GHCR push (sha-<merge-commit>, latest)
#                               + booster-gitops'ta etiket guncellenir -> ArgoCD canliya alir
#   workflow_dispatch        -> varsayilan branch'ten elle yayin (acil durum)
#
# Kota notlari:
#   - Build ve deploy AYNI job'da (her job dakikaya yukari yuvarlanarak faturalanir).
#   - Dockerfile once yalnizca .csproj'lari kopyalayip restore eder; kod
#     degisikliklerinde NuGet katmani onbellekten gelir.
#   - PR build'leri onbellegi okur ama yazmaz; timeout 15 dk.
name: _build-image

on:
  workflow_call:
    inputs:
      image:   { type: string, required: true }   # ör. booster-auth-idp
      project: { type: string, required: true }   # ör. Idps/Booster.Auth.Idp/Booster.Auth.Idp.csproj
      app:     { type: string, required: true }   # ör. Booster.Auth.Idp  (dll adi)
      gitops-path:                                 # etiketin guncellenecegi ortam klasoru
        type: string
        default: envs/demo/services
    secrets:
      GITOPS_DEPLOY_KEY:                           # booster-gitops'a yazma izinli deploy key (SSH)
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Yayin mi? (merge edilen PR veya varsayilan branch'ten elle calistirma)
      RELEASE: ${{ (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged) || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) }}
      # Image'a girecek kod: merge edilen PR'da merge commit'i, digerlerinde tetikleyen commit.
      SOURCE_SHA: ${{ github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.sha }}
    # Ayni PR'a arka arkaya push gelirse eski kontrol iptal edilir. Yayinlar ayri grupta;
    # art arda iki merge'de eskisi iptal edilir (yenisi her iki degisikligi de icerir).
    concurrency:
      group: ${{ inputs.image }}-${{ github.event.pull_request.merged && 'release' || github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      # GHCR image adlari kucuk harf olmak zorunda (Booster-tr -> booster-tr)
      - name: Image adi
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.image }}" >> "$GITHUB_ENV"
          echo "TAG=sha-${SOURCE_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR girisi
        if: env.RELEASE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha-<kisa-sha>: degismez, GitOps bunu kullanir. latest: yalnizca yayinda.
      - name: Etiketler
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ env.RELEASE }}

      - name: Build ve push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            PROJECT=${{ inputs.project }}
            APP_NAME=${{ inputs.app }}
            VERSION=${{ env.TAG }}
            REVISION=${{ env.SOURCE_SHA }}
          push: ${{ env.RELEASE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Katman onbellegi image basina ayri; degismeyen katmanlar (base, NuGet) yeniden
          # build/yuklenmez. Yalnizca yayinlar onbellege yazar.
          cache-from: type=gha,scope=${{ inputs.image }}
          # ignore-error: merge edilen PR'in "closed" olayinda GitHub cache'e yazma izni vermiyor
          # ("token has no writable scopes"); yazma hatasi yayini dusurmesin. Okuma master'daki
          # onbellekten (push/workflow_dispatch calismalarinin yazdigi) devam eder.
          cache-to: ${{ env.RELEASE == 'true' && format('type=gha,scope={0},mode=max,ignore-error=true', inputs.image) || '' }}

      # --- CD: GitOps reposunda image etiketini guncelle ---------------------
      # Cluster'a dogrudan dokunmaz; yalnizca booster-gitops'a commit atar,
      # gerisini ArgoCD yapar. Her servis farkli dosyaya yazar; ayni anda gelen
      # push'lari "pull --rebase + tekrar dene" dongusu cozer.
      - name: GitOps reposunu al
        if: env.RELEASE == 'true'
        uses: actions/checkout@v4
        with:
          repository: Booster-tr/booster-gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: .gitops

      - name: Etiketi guncelle ve push et
        if: env.RELEASE == 'true'
        working-directory: .gitops
        env:
          IMAGE_NAME: ${{ inputs.image }}
          GITOPS_PATH: ${{ inputs.gitops-path }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"

          # Bu image'i kullanan manifestler (ör. idp.yaml: initContainer + container)
          FILES=$(grep -rlF "image: ${IMG}:" "$GITOPS_PATH" || true)
          if [ -z "$FILES" ]; then
            echo "::notice::${IMG} ${GITOPS_PATH} altinda kullanilmiyor; deploy atlandi."
            exit 0
          fi

          sed -i -E "s#(image: ${IMG}):[A-Za-z0-9._-]+#\1:${TAG}#g" $FILES
          if git diff --quiet; then
            echo "Etiket zaten ${TAG}; degisiklik yok."
            exit 0
          fi
          git diff --stat

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(${GITOPS_PATH#envs/}): ${IMAGE_NAME} -> ${TAG}" \
            -m "Kaynak: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SOURCE_SHA}${PR_NUMBER:+ (PR #${PR_NUMBER})}" \
            -m "Calisma: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push reddedildi, yeniden deneniyor ($i)"
            sleep $((i * 3))
            git pull --rebase
          done
          echo "::error::GitOps push basarisiz"
          exit 1
